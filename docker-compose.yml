version: '3.8'

services:
  # MemoryOS Application Container
  memoryos-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_FILE=/app/data/memoryos.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - memoryos-data:/app/data
    restart: unless-stopped

  # Optional PostgreSQL with pgvector for production deployments
  # pgvector-db:
  #   image: pgvector/pgvector:pg16
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: memoryos_password
  #     POSTGRES_DB: memoryos
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  memoryos-data:
  # pgdata:
